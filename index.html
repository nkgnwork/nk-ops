              const p = "cfg.ent." + k,
                E = S.cfg.ent[k];
              return `<div class="card"><h2>${chipN(k)} ${esc(E.nombre || "Restobar")}</h2><div class="grid">${inS(p + ".nombre", "Nombre")}${inS(p + ".razon", "Razón social")}${inS(p + ".rut", "RUT emisor", { t: "rut", mono: 1 })}${E.rut && !RUT.ok(E.rut) ? '<span class="sm" style="color:var(--err)">RUT inválido</span>' : ""}${inS(p + ".dir", "Dirección")}${inS(p + ".mail", "Correo")}${inS(p + ".web", "Web")}${inS(p + ".banco", "Banco")}${inS(p + ".cuenta", "Cuenta")}
  <div class="row">${inS(p + ".nav", "Navegador de esta empresa", {
    sel: [
      ["chrome", "Chrome"],
      ["edge", "Edge"],
    ],
  })}${inS(p + ".mailProv", "Correo web", {
    sel: [
      ["", "— sin definir —"],
      ["outlook", "Outlook / Hotmail"],
      ["outlook365", "Outlook 365"],
      ["gmail", "Gmail"],
    ],
  })}</div>
  ${inS(p + ".mailNav", "Navegador del correo", {
    sel: [
      ["chrome", "Chrome"],
      ["edge", "Edge"],
    ],
  })}
  <div class="row">${inS(p + ".color", "Color documentos", { type: "color" })}${inS(p + ".zebra", "Color filas", { type: "color" })}</div>
  <div class="flex">${E.logo ? `<img src="${E.logo}" style="max-height:48px;max-width:140px;background:#fff;border-radius:6px;padding:4px">` : '<span class="sm mu">Sin logo</span>'}<span class="sp"></span><button class="btn s" data-logo="${k}">Subir logo</button>${E.logo ? `<button class="btn s g" data-nologo="${k}">${ic("x")}</button>` : ""}</div></div></div>`;
            }).join(
              "",
            )}</div><p class="sm mu" style="margin-top:10px">Hotel Las Vicuñas usa su café #3D220F. Nunca los colores de nkgnwork ni de upscale en documentos del hotel.</p>`;
        if (t === "fir")
          h = `<div class="card"><h2>${ic("cot")} Firma de documentos</h2><div class="grid g2">${inS("cfg.firma.nombre", "Nombre")}${inS("cfg.firma.titulo", "Título")}${inS("cfg.firma.cargo", "Cargo")}${inS("cfg.firma.tel", "Teléfono")}${inS("cfg.firma.mailPersonal", "Correo personal")}</div></div><div class="card" style="margin-top:14px"><h2>${ic("people")} Equipo</h2><div class="grid g3">${(S.cfg.equipo || []).map((e, i) => inS(`cfg.equipo.${i}.n`, "Nombre") + inS(`cfg.equipo.${i}.rol`, "Rol") + inS(`cfg.equipo.${i}.tel`, "WhatsApp", { mono: 1, ph: "[pendiente]" })).join("")}</div></div>`;
        if (t === "seg")
          DB.keys().then((ks) => {
            const n = ks.filter((k) => String(k).startsWith("bak_")).length;
            const e = $("#bkN");
            if (e) e.textContent = n;
          });
        if (t === "seg")
          h = `${syncPanel()}<div class="grid g2" style="margin-top:14px"><div class="card"><h2>${ic("lock")} Acceso</h2><div class="grid">${inS("cfg.autolock", "Bloqueo automático tras (minutos sin uso)", { t: "int" })}${inS("cfg.sonido", "Sonidos", { type: "checkbox" })}<button class="btn" onclick="changePass()">${ic("key")} Cambiar clave</button></div><p class="sm mu" style="margin-top:12px">Los datos se guardan cifrados con AES-256-GCM. La clave nunca se guarda: si se olvida, solo un respaldo con su clave permite recuperar.</p></div>
  <div class="card"><h2>${ic("save")} Respaldos</h2><div class="grid"><div class="flex"><button class="btn p" onclick="exportBackup()">${ic("save")} Exportar respaldo cifrado</button><button class="btn" onclick="importBackup()">${ic("hist")} Restaurar</button></div>
  <div class="al ${fileHandle ? "ok" : "warn"}"><div class="ic">${ic(fileHandle ? "ok" : "warn")}</div><div><b>Respaldo automático a archivo: ${fileHandle ? "activo" : "desactivado"}</b><span>${fileHandle ? esc(fileHandle.name) + " · se actualiza cada vez que guardas (máx. 1 vez por 45 s)" : "Elige un archivo en una carpeta que se respalde (Drive, OneDrive o pendrive)."}</span></div></div>
  <div class="flex"><button class="btn" onclick="pickFile()">${fileHandle ? "Cambiar archivo" : "Activar"}</button>${fileHandle ? '<button class="btn" onclick="reauthFile()">Reactivar permiso</button>' : ""}</div>
  <div class="flex"><button class="btn" onclick="importBookingUI()">Importar export de Booking</button><button class="btn" onclick="importDocsUI()">Importar gestiones (JSON)</button></div>
  <div class="al ${dirHandle ? "ok" : "warn"}"><div class="ic">${ic(dirHandle ? "ok" : "warn")}</div><div><b>Carpeta vigilada: ${dirHandle ? esc(dirHandle.name) : "ninguna"}</b><span>Los exports de Booking, los chats de WhatsApp y los contactos de Outlook que caigan ahí se importan solos.</span></div></div>
  <div class="flex"><button class="btn" onclick="pickDir()">${dirHandle ? "Cambiar carpeta" : "Elegir Descargas"}</button>${dirHandle ? '<button class="btn" onclick="scanDir(true)">Revisar ahora</button>' : ""}</div>${inS("cfg.borrarExports", "Borrar cada export de la carpeta después de importarlo (recomendado: son datos personales sin cifrar)", { type: "checkbox" })}
  <div class="sm mu">Copias diarias internas: <b id="bkN">…</b> (se guardan las últimas 7).</div></div></div>
  <div class="card" style="border-color:color-mix(in srgb,var(--err) 40%,transparent)"><h2 style="color:var(--err)">${ic("warn")} Zona peligrosa</h2><p class="sm mu">Borra todos los datos de este computador. Exporta un respaldo antes.</p><button class="btn d" style="margin-top:10px" id="wipe">Borrar todo</button></div></div>`;
        if (t === "log")
          h = `<div class="card t table-scroll"><table class="tb"><thead><tr><th>Fecha</th><th>Acción</th><th>Ref.</th></tr></thead><tbody>${S.log
            .slice(0, 300)
            .map(
              (l) =>
                `<tr><td class="sm mono">${new Date(l.t).toLocaleString("es-CL", { dateStyle: "short", timeStyle: "medium" })}</td><td>${esc(l.a)}</td><td class="mono sm">${esc(l.ref)}</td></tr>`,
            )
            .join("")}</tbody></table></div>`;
        $("#main").innerHTML =
          H(
            "Ajustes",
            `NK·OPS v${APP.ver} · build ${APP.build}`,
            `<button class="btn" onclick="V.cfg('vis')">${ic("cfg")} Colores de la app</button>`,
          ) +
          `<div class="seg" id="cT" style="margin-bottom:16px">${tabs.map(([k, n]) => `<button class="${t === k ? "on" : ""}" data-v="${k}">${ic({ vis: "cfg", tar: "bed", cob: "cash", emp: "dir", fir: "people", seg: "lock", log: "hist" }[k])} ${n}</button>`).join("")}</div>` +
          h;
        $$("#cT button").forEach((b) => (b.onclick = () => V.cfg(b.dataset.v)));
        syncPanelBind();
        $$("[data-palette-choice]").forEach(
          (button) =>
            (button.onclick = () => {
              S.cfg.paleta = button.dataset.paletteChoice;
              applyAppearance();
              save();
              V.cfg("vis");
            }),
        );
        $$("[data-theme-choice]").forEach(
          (button) =>
            (button.onclick = () => {
              S.cfg.tema = button.dataset.themeChoice;
              applyAppearance();
              save();
              V.cfg("vis");
            }),
        );
        bindS($("#main"), (el, v) => {
          const p = el.dataset.s;
          if (/^tar\.(hab|pref|extra)/.test(p)) {
            const txt = `Avisar a Christian: cambió una tarifa del hotel (${p.replace("tar.", "")} → ${v == null ? "vacío" : clp(v)})`;
            S.tareas.unshift({ id: uid(), t: txt, ok: false, neg: "HLV" });
            toast("Tarifa actualizada · pendiente: avisar a Christian");
          }
          if (p.startsWith("tar.") || p.includes(".rut") || p === "cfg.iva") V.cfg();
          if (p === "cfg.ent.RB.activo") renderNav();
        });
        $$("[data-tud]").forEach(
          (b) =>
            (b.onclick = async () => {
              if (S.docs.some((d) => d.lineas.some((l) => l.k === "tour" && l.ref === b.dataset.tud)))
                return toast("Ese tour está en gestiones guardadas: renómbralo en vez de borrarlo");
              S.tar.tours = S.tar.tours.filter((x) => x.id !== b.dataset.tud);
              save();
              V.cfg();
            }),
        );
        if ($("#altaAdd"))
          $("#altaAdd").onclick = () => {
            (S.tar.alta ??= []).push({ n: "Evento", desde: today(), hasta: today(), min: 2 });
            save();
            V.cfg();
          };
        $$("[data-altad]").forEach(
          (b) =>
            (b.onclick = () => {
              S.tar.alta.splice(+b.dataset.altad, 1);
              save();
              V.cfg();
            }),
        );
        if ($("#prAdd"))
          $("#prAdd").onclick = () => {
            S.tar.promos = S.tar.promos || [];
            S.tar.promos.push({
              id: uid(),
              n: "Nueva promoción",
              neg: "HLV",
              pct: 10,
              desde: today(),
              hasta: "",
              activa: false,
            });
            save();
            V.cfg();
          };
        $$("[data-prd]").forEach(
          (b) =>
            (b.onclick = () => {
              if (S.docs.some((d) => Object.values(d.promos || {}).includes(b.dataset.prd)))
                return toast("Esa promoción está en gestiones guardadas: desactívala en vez de borrarla");
              S.tar.promos = S.tar.promos.filter((p) => p.id !== b.dataset.prd);
              save();
              V.cfg();
            }),
        );
        if ($("#tuAdd"))
          $("#tuAdd").onclick = () => {
            S.tar.tours.push({
              id: uid(),
              n: "Nuevo tour",
              precio: null,
              incluye: "",
            });
            save();
            V.cfg();
          };
        $$("[data-logo]").forEach(
          (b) =>
            (b.onclick = () => {
              const f = $("#fileIn");
              f.accept = "image/*";
              f.onchange = () => {
                const file = f.files[0];
                f.value = "";
                if (!file) return;
                const img = new Image();
                img.onload = () => {
                  const s = Math.min(1, 600 / Math.max(img.width, img.height)),
                    c = document.createElement("canvas");
                  c.width = img.width * s;
                  c.height = img.height * s;
                  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
                  S.cfg.ent[b.dataset.logo].logo = c.toDataURL("image/png");
                  save();
                  V.cfg();
                };
                img.src = URL.createObjectURL(file);
              };
              f.click();
            }),
        );
        $$("[data-nologo]").forEach(
          (b) =>
            (b.onclick = () => {
              S.cfg.ent[b.dataset.nologo].logo = null;
              save();
              V.cfg();
            }),
        );
        if ($("#wipe"))
          $("#wipe").onclick = () => {
            modal(
              `<h2 style="color:var(--err)">Borrar todo</h2><p class="mu" style="margin:8px 0">Escribe BORRAR para confirmar.</p><input class="in" id="wp"><div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeAll()">Cancelar</button><button class="btn d" id="wpo">Borrar</button></div>`,
            );
            $("#wpo").onclick = async () => {
              if ($("#wp").value !== "BORRAR") return toast("Texto incorrecto");
              const cur = await DB.get("vault");
              await DB.set("bak_antes_de_borrar_" + Date.now(), cur);
              await DB.del("vault");
              location.reload();
            };
          };
      };

      /* ================= arranque ================= */
      boot().catch((e) => {
        document.body.innerHTML =
          '<p style="padding:40px;font-family:sans-serif">No se pudo abrir el almacenamiento local: ' + esc(e.message) + "</p>";
      });
    </script>
  </body>
</html>
