    <script>
      "use strict";
      /* =====================================================================
   NK·OPS — Panel de operación de Nikolas Krause G. (HLV · VVT · Restobar)
   Un solo archivo, sin dependencias, datos cifrados en este PC.

   ÍNDICE DE MÓDULOS (en orden)
    1. Núcleo ............ utilidades, fechas, RUT, IndexedDB, cifrado, folios XNK, datos iniciales
    2. Motor ............. cálculo, control previo (pre), textos de salida, PDF
    3. UI base ........... navegación, bloqueo, respaldos, paleta Ctrl+K, alertas
    4. Vistas I .......... Hoy, Cotizar, Gestiones, Facturación
    5. Integraciones ..... lector xlsx/csv, Booking, cola diaria, informes, importación
    6. APIs gratuitas .... indicadores, divisas, clima, feriados, rutas (OSRM)
    7. CRM ............... pasajeros desde Booking, gestiones, WhatsApp y Outlook
    8. Automático ........ carpeta vigilada, puesta en marcha, refresco
    9. Cuaderno .......... sincronía con el cuaderno de recepción
   10. Vistas II ......... Directorio, Mensajes, Respuestas, Flota, Restobar, Ajustes, arranque

   Reglas de negocio y qué se puede tocar: ver CODEX.md.
   ===================================================================== */

      /* =====================================================================
   NK·OPS — núcleo. Todo lo que emite este panel lleva prefijo XNK-.
   Reglas de negocio: ver CODEX.md §3 (no cambiar sin orden de Nik).
   ===================================================================== */
      const APP = { ver: "3.1.0", build: "20261115a", prefix: "XNK" };
      const $ = (s, r = document) => r.querySelector(s),
        $$ = (s, r = document) => [...r.querySelectorAll(s)];
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const moduleArt = {
        cot: "documents",
        doc: "archive",
        people: "people",

        book: "book",
        fac: "invoice",
        report: "report",

        msg: "messages",

        car: "fleet",
        cfg: "settings",
      };
      const moduleBadge = (n, c = "") =>
        moduleArt[n]
          ? `<img class="i module-art ${c}" src="./assets/modulo-${moduleArt[n]}.png" alt="" aria-hidden="true">`
          : `<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
      const ic = (n, c = "") => `<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
      const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
      const clp = (n) => (n == null || isNaN(n) ? "—" : "$" + Math.round(n).toLocaleString("es-CL"));
      const pint = (v) => {
        const n = parseInt(String(v ?? "").replace(/[^\d-]/g, ""), 10);
        return isNaN(n) ? 0 : n;
      };
      const pnum = (v) => {
        if (v === "" || v == null) return null;
        const n = Number(String(v).replace(/\./g, "").replace(",", "."));
        return isNaN(n) ? null : n;
      };
      const clone = (o) => JSON.parse(JSON.stringify(o));
      const pl = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
      /* ---------- fechas (siempre locales, sin UTC) ---------- */
      const pad = (n) => String(n).padStart(2, "0");
      const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const today = () => iso(new Date());
      const pd = (s) => {
        if (!s) return null;
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      };
      const addDays = (s, n) => {
        const d = pd(s);
        d.setDate(d.getDate() + n);
        return iso(d);
      };
      const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
      const DIAS = {
        es: ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"],
        en: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
      };
      const MES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
      const fD = (s, l = "es") => {
        if (!s) return "[fecha]";
        const d = pd(s);
        return l === "en"
          ? `${DIAS.en[d.getDay()]} ${pad(d.getMonth() + 1)}/${pad(d.getDate())}/${d.getFullYear()}`
          : `${DIAS.es[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
      };
      const fDs = (s) => {
        if (!s) return "—";
        const d = pd(s);
        return `${pad(d.getDate())} ${MES[d.getMonth()]}`;
      };
      const nowTxt = () =>
        new Date().toLocaleString("es-CL", {
          dateStyle: "short",
          timeStyle: "short",
        });
      /* ---------- RUT chileno (módulo 11) ---------- */
      const RUT = {
        clean: (r) =>
          String(r || "")
            .replace(/[^\dkK]/g, "")
            .toUpperCase(),
        dv(n) {
          let s = 0,
            m = 2;
          for (let i = n.length - 1; i >= 0; i--) {
            s += +n[i] * m;
            m = m === 7 ? 2 : m + 1;
          }
          const r = 11 - (s % 11);
          return r === 11 ? "0" : r === 10 ? "K" : String(r);
        },
        ok(r) {
          const c = RUT.clean(r);
          if (c.length < 2) return false;
          return RUT.dv(c.slice(0, -1)) === c.slice(-1);
        },
        fmt(r) {
          const c = RUT.clean(r);
          if (c.length < 2) return r || "";
          const b = c.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
          return b + "-" + c.slice(-1);
        },
      };
      const phoneDigits = (t) => String(t || "").replace(/\D/g, "");

      /* ---------- almacenamiento cifrado ---------- */
      const b64 = (u8) => {
        let s = "";
        for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
        return btoa(s);
      };
      const ub64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      const DB = {
        db: null,
        open() {
          return new Promise((res, rej) => {
            const r = indexedDB.open("nkops", 1);
            r.onupgradeneeded = () => r.result.createObjectStore("kv");
            r.onsuccess = () => {
              DB.db = r.result;
              res();
            };
            r.onerror = () => rej(r.error);
          });
        },
        get(k) {
          return new Promise((res, rej) => {
            const q = DB.db.transaction("kv").objectStore("kv").get(k);
            q.onsuccess = () => res(q.result);
            q.onerror = () => rej(q.error);
          });
        },
        set(k, v) {
          return new Promise((res, rej) => {
            const t = DB.db.transaction("kv", "readwrite");
            t.objectStore("kv").put(v, k);
            t.oncomplete = res;
            t.onerror = () => rej(t.error);
          });
        },
        del(k) {
          return new Promise((res) => {
            const t = DB.db.transaction("kv", "readwrite");
            t.objectStore("kv").delete(k);
            t.oncomplete = res;
          });
        },
        keys() {
          return new Promise((res) => {
            const q = DB.db.transaction("kv").objectStore("kv").getAllKeys();
            q.onsuccess = () => res(q.result);
          });
        },
      };
      const CR = {
        async key(pass, salt) {
          const b = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
          return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" },
            b,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"],
          );
        },
        async enc(key, obj) {
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
          return { iv: b64(iv), ct: b64(new Uint8Array(ct)) };
        },
        async dec(key, rec) {
          const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(rec.iv) }, key, ub64(rec.ct));
          return JSON.parse(new TextDecoder().decode(pt));
        },
      };
      let S = null,
        KEY = null,
        SALT = null,
        saveT = null,
        lastSave = 0,
        fileHandle = null,
        lastFile = 0;
      async function persist() {
        if (AUTH_REKEY) return;
        const signingKey = KEY;
        const r = await CR.enc(KEY, S);
        if (AUTH_REKEY || signingKey !== KEY) return;
        const rec = {
          app: "nkops",
          v: 1,
          auth: AUTH_MODE === "pin4" ? "pin4" : undefined,
          salt: b64(SALT),
          ...r,
          at: Date.now(),
        };
        await DB.set("vault", rec);
        lastSave = Date.now();
        if (!SYNC.adoptando) syncMark();
        if (fileHandle && Date.now() - lastFile > 45e3) {
          try {
            if ((await fileHandle.queryPermission({ mode: "readwrite" })) === "granted") {
              const w = await fileHandle.createWritable();
              await w.write(JSON.stringify(rec));
              await w.close();
              lastFile = Date.now();
            }
          } catch (e) {}
        }
        UI.saved();
      }
      function save() {
        clearTimeout(saveT);
        UI.saving();
        saveT = setTimeout(() => persist().catch((e) => toast("Error al guardar: " + e.message)), 350);
      }
      function audit(a, ref = "") {
        S.log.unshift({ t: Date.now(), a, ref });
        if (S.log.length > 3000) S.log.length = 3000;
      }

      /* ---------- folios XNK (únicos, nunca se reutilizan) ---------- */
      function nextFolio(kind = "") {
        const d = new Date();
        const ym = `${String(d.getFullYear()).slice(2)}${pad(d.getMonth() + 1)}`;
        const k = kind + ym;
        S.seq[k] = (S.seq[k] || 0) + 1;
        return `${APP.prefix}-${kind ? kind + "-" : ""}${ym}-${String(S.seq[k]).padStart(4, "0")}`;
      }
      function codigoReserva(doc) {
        /* lectura de Nik: fecha de llegada al revés + iniciales del cliente */
        const f = doc.in || today();
        const [y, m, dd] = f.split("-");
        const rev = (dd + m + y.slice(2)).split("").reverse().join("");
        const ini = (doc.cli.nombre || "XX")
          .normalize("NFD")
          .replace(/[^A-Za-z ]/g, "")
          .split(/\s+/)
          .filter(Boolean)
          .map((w) => w[0])
          .join("")
          .slice(0, 2)
          .toUpperCase()
          .padEnd(2, "X");
        let c = `${APP.prefix}-${rev}${ini}`,
          n = 0;
        const used = new Set(
          S.docs
            .filter((x) => x.id !== doc.id)
            .map((x) => x.codigo)
            .filter(Boolean),
        );
        while (used.has(c)) {
          n++;
          c = `${APP.prefix}-${rev}${ini}${String.fromCharCode(64 + n)}`;
        }
        return c;
      }

          const T = S.tar.traslado;
          unit = T.base + T.porKm * (l.km || 0);
          if (!T.iva) miss = "ivaTras";
          if (T.iva === "mas") {
            neto = unit * l.cant;
            tot = neto * (1 + iv);
          } else {
            tot = unit * l.cant;
            neto = tot / (1 + iv);
          }
          q = `${l.km || 0} km × ${l.cant}`;
        } else if (l.k === "rb") {
          const c = carta(l.ref);
          unit = c?.precio ?? null;
          if (unit == null) miss = "precio";
          tot = (unit || 0) * l.cant;
          neto = tot / (1 + iv);
          q = `× ${l.cant}`;
        } else {
          unit = l.unit;
          if (unit == null || unit === "") miss = "precio";
          const u = +unit || 0;
          if (l.iva === "mas") {
            neto = u * l.cant;
            tot = neto * (1 + iv);
          } else {
            tot = u * l.cant;
            neto = tot / (1 + iv);
          }
          q = `× ${l.cant}`;
        }
        tot = Math.round(tot);
        neto = Math.round(neto);
        if (orig != null) orig = Math.round(orig);
        return { tot, neto, iva: tot - neto, unit, miss, orig, n, q };
      }

      function calc(d) {
        const g = {};
        let total = 0,
          normal = 0;
        for (const l of d.lineas) {
          const r = lc(l, d);
          l._c = r;
          const G = (g[l.neg] ??= {
            tot: 0,
            neto: 0,
            iva: 0,
            rec: 0,
            fin: 0,
            orig: 0,
            lines: [],
          });
          G.tot += r.tot;
          G.neto += r.neto;
          G.iva += r.iva;
          G.orig += r.orig ?? r.tot;
          G.lines.push(l);
        }
        const pct = S.cfg.recargoTarjeta;
        for (const k in g) {
          const G = g[k];
          // El recargo va solo sobre lo que se paga con tarjeta: en el hotel, con tarifa normal, el abono se transfiere y el saldo va con tarjeta.
          G.abono = k === "HLV" && d.modo !== "pref" && d.in !== today() && !contOf(d)?.reglas?.oc ? Math.round(G.tot / 2) : 0;
          G.rec = d.pagoMedio === "tarjeta" && pct != null ? Math.round(((G.tot - G.abono) * pct) / 100) : 0;
          G.fin = G.tot + G.rec;
          total += G.fin;
          normal += G.orig + G.rec;
        }
        const pagado = d.pagos.reduce((s, p) => s + (+p.monto || 0), 0);
        return {
          g,
          total,
          normal,
          pagado,
          saldo: total - pagado,
          negs: NEGS.filter((k) => g[k]),
        };
      }

        let bank = false;
        const pr = promoDe(d, k);
        if (k === "HLV") {
          if (oc) out.push(L.oc);
          else if (d.modo === "pref") {
            out.push(m === "transferencia" ? L.prefT : L.pref);
            bank = m === "transferencia";
          } else if (d.in === today()) {
            out.push(`${L.hoy.replace(/\.$/, "")} ${L.hoyVia[m] || ""}.`.replace(" .", "."));
            bank = m === "transferencia";
          } else {
            const s = G.fin - G.abono;
            out.push(m === "mp" ? L.abonoMP(clp(G.abono), clp(s)) : L.abono(clp(G.abono), clp(s)));
            if (m === "efectivo") out.push(L.saldoEf);
            else if (m === "tarjeta" && pct != null) out.push(L.saldoTj(pct));
            else out.push(L.formas(pct));
            bank = m !== "mp";
          }
          if (promoPct(d, "HLV") && d.modo !== "pref") out.push(L.promo(pr.n, pr.pct));
        }
        if (k === "VVT" || k === "RB") {
          if (promoPct(d, k)) {
            out.push(L.promo(pr.n, pr.pct));
            bank = m === "transferencia" && !!E.cuenta;
          } else if (m === "transferencia" && E.cuenta) bank = true;
          else out.push(L.vvtPago);
          if (G.rec) out.push(L.rec(pct));
        }
        return { out, bank: bank && !!E.cuenta && !oc };

      let AC = null;
      function beep(kind = "ok") {
        if (!S?.cfg.sonido) return;
        try {
          AC = AC || new AudioContext();
          const t = AC.currentTime,
            g = AC.createGain();
          g.connect(AC.destination);
          if (kind === "tick") {
            const o = AC.createOscillator();
            o.frequency.value = 1400;
            o.connect(g);
            g.gain.setValueAtTime(0.05, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
            o.start(t);
            o.stop(t + 0.07);
            return;
          }
          const n = AC.createBufferSource(),
            b = AC.createBuffer(1, AC.sampleRate * 0.25, AC.sampleRate),
            ch = b.getChannelData(0);
          for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length) ** 2;
          const f = AC.createBiquadFilter();
          f.type = "bandpass";
          f.frequency.setValueAtTime(400, t);
          f.frequency.exponentialRampToValueAtTime(3000, t + 0.22);
          n.buffer = b;
          n.connect(f);
          f.connect(g);
          g.gain.setValueAtTime(0.08, t);
          n.start(t);
          [880, 1320, 2640].forEach((fr, i) => {
            const o = AC.createOscillator(),
              gg = AC.createGain();
            o.type = "sine";
            o.frequency.value = fr;
            o.connect(gg);
            gg.connect(AC.destination);
            gg.gain.setValueAtTime(0, t + 0.22);
            gg.gain.linearRampToValueAtTime(0.12 / (i + 1), t + 0.24);
            gg.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
            o.start(t + 0.22);
            o.stop(t + 1.5);
          });
          const s = AC.createOscillator(),
            sg = AC.createGain();
          s.frequency.value = 55;
          s.connect(sg);
          sg.connect(AC.destination);
          sg.gain.setValueAtTime(0.18, t + 0.22);
          sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
          s.start(t + 0.22);
          s.stop(t + 0.65);
        } catch (e) {}
      }

      async function commitPin(pin, source, payload) {
        if (!isPin(pin)) throw Error("El PIN debe tener exactamente 4 dígitos.");
        AUTH_REKEY = true;
        clearTimeout(saveT);
        try {
          const salt = crypto.getRandomValues(new Uint8Array(16));
          const key = await CR.key(pin, salt);
          const encrypted = await CR.enc(key, payload);
          const rec = { app: "nkops", v: 1, auth: "pin4", salt: b64(salt), ...encrypted, at: Date.now() };
          await new Promise((resolve, reject) => {
            const tx = DB.db.transaction("kv", "readwrite"),
              store = tx.objectStore("kv"),
              request = store.get("vault");
            request.onsuccess = () => {
              const current = request.result;
              if (source ? !current || current.ct !== source.ct || current.salt !== source.salt : !!current) {
                tx.abort();
                return;
              }
              if (source) store.put(source, "bak_antes_pin_" + Date.now());
              store.put(rec, "vault");
            };
            tx.oncomplete = resolve;
            tx.onerror = tx.onabort = () => reject(Error("La bóveda cambió en otra ventana. Recarga antes de continuar."));
          });

          .filter(Boolean)
          .join("\n");
        return { tx, err };

      /* =====================================================================
   v2.0 · EMITIR BOLETA O FACTURA DIRECTA
   Para lo que no pasó por una cotización de estadía: servicios sueltos, una factura que una empresa
   pide por WhatsApp, un traslado. La app arma cada campo para copiarlo en el SII (la emisión real
   ocurre allá y es irreversible); después se registra el N° y se envía al cliente.
   ===================================================================== */
      const EMI_RUT_RE = /\b(\d{1,2}\.?\d{3}\.?\d{3}\s*-\s*[\dkK])\b/;
      const EMI_LBL =
        /\s+(?=(?:raz[oó]n\s+social|nombre|empresa|r\.?\s?u\.?\s?t\.?|giro|actividad|direcci[oó]n|domicilio|comuna|ciudad|correo|e-?mail|mail|tel[eé]fono|fono|celular)\s*[:.]\s*)/gi;
      // Lee los datos de facturación que manda un cliente ("Razón social: … Rut: … Giro: … Dirección: …").
      function parseEmpresa(txt) {
        const o = {};
        if (!txt || !String(txt).trim()) return o;
        const raw = String(txt).replace(EMI_LBL, "\n");
        const L = raw
          .split(/\r?\n|\s*[;|]\s*/)
          .map((s) => s.trim())
          .filter(Boolean);
        // RUT de la empresa: el rotulado "Rut:", si no uno de persona jurídica (≥ 50 millones), si no el primero
        const cands = [...raw.matchAll(new RegExp(EMI_RUT_RE.source, "g"))].map((x) => ({
          r: x[1],
          rot: /r\.?\s?u\.?\s?t\.?\s*:?\s*$/i.test(raw.slice(Math.max(0, x.index - 8), x.index)),
          jur: +RUT.clean(x[1]).slice(0, -1) >= 5e7,
        }));
        const r = cands.find((x) => x.rot && RUT.ok(x.r)) || cands.find((x) => x.jur && RUT.ok(x.r)) || cands[0];
        if (r) {
          o.rut = RUT.fmt(r.r);
          o.rutOk = RUT.ok(r.r);
        }
        const m = raw.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
        if (m) o.mail = m[0].toLowerCase();
        for (const l of L) {
          const x = l.match(/^([a-záéíóúñ .°/-]{2,22}?)\s*[:.]\s*(.+)$/i);
          if (!x) continue;
          const k = normTxt(x[1]),
            v = x[2].trim().replace(/[.,;]\s*$/, "");
          if (/raz|nombre|empresa|cliente/.test(k)) o.nombre ??= v;
          else if (/giro|actividad/.test(k)) o.giro ??= v;
          else if (/direc|domicilio/.test(k)) o.dir ??= v;
          else if (/comuna/.test(k)) o.comuna ??= v;
          else if (/ciudad/.test(k)) o.ciudad ??= v;
          else if (/fono|tel|celular/.test(k)) o.tel ??= v;
        }
        // razón social sin etiqueta: la línea con forma societaria, o la primera línea de texto
        if (!o.nombre) {
          const soc = /\b(ltda\.?|limitada|spa|s\.\s?a\.?|eirl|e\.i\.r\.l\.?|sociedad|cia\.?|compa[ñn][ií]a)\b/i;
          const sinEt = L.filter((l) => !/^[a-záéíóúñ .°/-]{2,22}\s*[:.]\s*\S/i.test(l) && !/@/.test(l) && /[a-z]{3}/i.test(l));
          const n = sinEt.find((l) => soc.test(l)) || sinEt.find((l) => !EMI_RUT_RE.test(l) && l.split(/\s+/).length <= 8);
          if (n) o.nombre = n.replace(EMI_RUT_RE, "").trim();
        }
        if (o.dir && !o.comuna) {
          // "pasaje riñihue 1022, puente alto" → comuna al final
          const c = o.dir.split(",").map((s) => s.trim());
          if (c.length > 1 && !/\d/.test(c.at(-1))) o.comuna = c.at(-1);
        }
        return o;
      }
      // Montos y conceptos sueltos en un texto: "$142.800", "traslado 180.000"
      function montosEn(txt) {
        return [...String(txt || "").matchAll(/\$\s?(\d{1,3}(?:\.\d{3})+|\d{4,})/g)].map((x) => +x[1].replace(/\./g, ""));
      }
      const emiNew = (tipo = "boleta", neg = "HLV") => ({
        id: uid(),
        folio: "",
        tipo,
        neg,
        estado: "borrador",
        neto: false,
        rec: { contId: null, nombre: "", rut: "", giro: "", dir: "", comuna: "", mail: "" },
        items: [{ d: "", cant: 1, pu: "" }],
        oc: "",
        hes: "",
        docId: null,
        num: "",
        fecha: today(),
        nota: "",
        enviado: 0,
        creado: Date.now(),
      });
      // prepara una boleta o factura desde una gestión ya cotizada
      function emiDesdeDoc(d) {
        const c = calc(d),
          neg = primaryNeg(d),
          cn = contOf(d),
          e = emiNew(esB2B(d) || d.factura ? "factura" : "boleta", neg);
        e.docId = d.id;
        e.oc = d.fac.oc || "";
        e.hes = d.fac.hes || "";
        e.rec = {
          ...e.rec,
          contId: cn?.id || null,
          nombre: cn?.nombre || d.cli.nombre,
          rut: cn?.rut || "",
          giro: cn?.giro || "",
          dir: cn?.dir || "",
          mail: cn?.mailFact || cn?.mail || d.cli.mail || "",
        };
        // un documento por empresa emisora: aquí va solo lo de la principal
        const fin = Math.round(c.g[neg].fin);
        if (cn?.reglas?.glosaSola && cn.glosa) e.items = [{ d: cn.glosa.toUpperCase(), x: "", cant: 1, pu: fin }];
        else {
          e.items = emiLineasDoc(d, neg);
          // recargo de tarjeta o redondeos: el documento debe sumar exactamente lo cobrado
          const dif = fin - e.items.reduce((t, i) => t + i.pu, 0);
          if (e.items.length && dif) e.items.at(-1).pu += dif;
          if (!e.items.length) e.items = [{ d: neg === "VVT" ? "SERVICIO TURISTICO" : "ALOJAMIENTO", x: "", cant: 1, pu: fin }];
        }
        e.nota = `Gestión ${d.folio}.`;
        const otras = c.negs.filter((k) => k !== neg);
        if (otras.length) e.nota += ` Falta emitir aparte lo de ${otras.map(NEGN).join(" y ")}.`;
        return e;
      }
      function emiCalc(e) {
        const iva = S.cfg.iva;
        const lines = e.items
          .filter((i) => String(i.d).trim() || +i.pu)
          .map((i) => {
            const cant = +i.cant || 0,
              pu = +String(i.pu).replace(/\D/g, "") || 0,
              puB = e.tipo === "factura" && e.neto ? Math.round(pu * (1 + iva)) : pu,
              puN = e.tipo === "factura" && e.neto ? pu : Math.round(pu / (1 + iva));
            return { d: String(i.d).trim(), x: String(i.x || "").trim(), cant, pu, puB, puN, subB: puB * cant, subN: puN * cant };
          });
        const bruto = lines.reduce((s, l) => s + l.subB, 0);
        let neto, ivaM, total;
        if (e.tipo === "boleta") {
          total = bruto;
          neto = Math.round(total / (1 + iva));
          ivaM = total - neto;
        } else {
          // el SII suma netos por línea y calcula el IVA sobre el total neto
          neto = lines.reduce((s, l) => s + l.subN, 0);
          ivaM = Math.round(neto * iva);
          total = neto + ivaM;
        }
        return { lines, bruto, neto, iva: ivaM, total };
      }
      function emiPre(e) {
        const E = [],
          W = [],
          c = emiCalc(e),
          ent = S.cfg.ent[e.neg];
        if (!ent?.rut) E.push(`Falta el RUT emisor de ${NEGN(e.neg)} (Ajustes → Empresas).`);
        if (!c.lines.length) E.push("Agrega al menos un servicio con su precio.");
        c.lines.forEach((l, i) => {
          if (!l.d) E.push(`Servicio ${i + 1}: falta la descripción.`);
          if (!(l.cant > 0)) E.push(`Servicio ${i + 1}: falta la cantidad.`);
          if (!(l.pu > 0)) E.push(`Servicio ${i + 1}: falta el precio.`);
        });
        const r = e.rec;
        if (e.tipo === "factura") {
          if (!r.nombre.trim()) E.push("Falta la razón social.");
          if (!r.rut) E.push("Falta el RUT de la empresa.");
          else if (!RUT.ok(r.rut)) E.push(`El RUT ${r.rut} no es válido: revisa el dígito verificador.`);
          if (!r.giro) W.push("Sin giro: el SII lo propone al escribir el RUT; elígelo ahí.");
          if (!r.dir) W.push("Sin dirección: el SII la propone al escribir el RUT; confírmala ahí.");
          if (c.total !== c.bruto && c.lines.length)
            W.push(`Por el redondeo del IVA, el SII mostrará ${clp(c.total)} (diferencia ${clp(c.total - c.bruto)}).`);
          const cn = r.contId && S.cont.find((x) => x.id === r.contId);
          if (cn?.reglas?.oc && !e.oc) E.push(`${cn.nombre} exige OC: anótala.`);
          if (cn?.reglas?.hes && !e.hes) E.push(`${cn.nombre} exige HES: sin HES no aceptan la factura.`);
        } else if (r.rut && !RUT.ok(r.rut)) E.push(`El RUT ${r.rut} no es válido: revisa el dígito verificador.`);
        const dup = S.facs.find(
          (f) =>
            f.id !== e.id &&
            f.tipo === e.tipo &&
            f.total === c.total &&
            (!r.rut || RUT.clean(f.rut || "") === RUT.clean(r.rut)) &&
            Math.abs(diffDays(f.fecha || today(), today())) <= 15,
        );

        [/\bESTACIONAMIENTO\b/g, "ESTAC"],
        [/\bTRASLADO\b/g, "TRASL"],
        [/\bALMUERZOS?\b/g, "ALM"],
        [/\bNOCHES\b/g, "NOCH"],
        [/\s+X\s+/g, " X"],
        [/\b(DE|DEL|LA|EL|LOS|LAS|A|AL|EN|POR|PARA)\b/g, ""],

      function emiCorto(txt, max) {
        let t = String(txt || "")

      /* ---------- leer el mensaje del cliente ----------

        diciembre: 12,
        dec: 12,
        december: 12,
        dicembre: 12,

      };
      const PED_NUM = {

        due: 2,
        deux: 2,

        dix: 10,
        zehn: 10,
      };
      const PED_HAB = [
        ["familiar", /\b(familiar|family|familiare|familiale)\b/],
        ["triple", /\b(triples?|tripla|triple room)\b/],
        [
          "matri",
          /\b(matrimonial(es)?|matrimoniale|queen|king|double bed|cama (de )?(2|dos) plazas|letto matrimoniale|lit double|doppelbett)\b/,
        ],
        ["doble", /\b(dobles?|double|twin|doppia|doppelzimmer|2 camas|dos camas)\b/],
        ["single", /\b(singles?|simples?|individual(es)?|singola|einzelzimmer)\b/],
      ];
      const PED_TOUR = [
        ["surire", /surire|flamenc|flamingo/],
        ["suriplaza", /suriplaza|cerros? de colores|colou?red (hills|mountains)/],
        ["payachatas", /payachata|caquena|iglesias/],
        ["tacora", /tacora|visviri|casiri/],
        ["astro", /astro|estrellas|stars|stargazing|cielo nocturno/],
        ["ascenso", /ascenso|subida desde arica|traslado (desde|de) arica|transfer from arica/],
        ["lauca", /lauca|chungar|parinacota/],
      ];
      const PED_LANG = {
        en: /\b(hello|hi|we|would|like|room|rooms|night|nights|booking|please|thanks|thank|people|our|arrive|stay)\b/g,
        it: /\b(buongiorno|ciao|camera|camere|notte|notti|vorremmo|grazie|prenotazione|siamo|persone|arrivo)\b/g,
        fr: /\b(bonjour|chambre|chambres|nuit|nuits|merci|nous|voudrions|reservation|personnes)\b/g,
        de: /\b(hallo|guten|zimmer|nacht|nachte|danke|wir|buchung|personen|mochten)\b/g,
        pt: /\b(ola|quarto|quartos|noite|noites|obrigad[oa]|gostariamos|reserva|pessoas|somos)\b/g,
        es: /\b(hola|habitacion|habitaciones|noche|noches|gracias|quisiera|quisieramos|reserva|personas|somos|llegamos|estimado|estimada)\b/g,
      };
      function parsePedido(txt, hoy) {
        const out = { hab: {}, tours: [], falta: [], leido: [] };
        if (!txt || !txt.trim()) return out;
        const raw = String(txt),
          t = raw.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’']/g, " ");
        const base = hoy ? new Date(hoy + "T12:00:00") : new Date();
        const ymd = (y, m, d) => {
          const x = new Date(Date.UTC(y, m - 1, d));
          return x.getUTCMonth() === m - 1 ? x.toISOString().slice(0, 10) : "";
        };
        // año: si la fecha ya pasó este año, es del próximo
        const conAnio = (m, d, y) => {
          if (y) return ymd(y < 100 ? 2000 + y : y, m, d);
          let yy = base.getFullYear(),
            s = ymd(yy, m, d);
          if (s && s < base.toISOString().slice(0, 10)) s = ymd(yy + 1, m, d);
          return s;
        };
        const mesDe = (w) => PED_MES[w] || PED_MES[w.slice(0, 3)] || 0;
        const MES = "([a-z]{3,10})",
          CON = "(?:al|a|au|hasta|to|till|until|bis|fino al|ate|-|–)";
        // primera coincidencia cuyo mes sea real (evita "2 adults" o "15 al")
        const hallar = (src, ok) => {
          for (const x of t.matchAll(new RegExp(src, "g"))) if (ok(x)) return x;
          return null;
        };
        let ini = "",
          fin = "";
        let m;
        // 15/11 al 19/11 · 15-11-2026 al 19-11-2026 · 15.11 - 19.11
        if (
          (m = t.match(
            /\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\s*(?:al|a|au|hasta|to|till|until|bis|-|–|y el)\s*(?:el\s*)?(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/,
          ))
        ) {
          ini = conAnio(+m[2], +m[1], m[3] && +m[3]);
          fin = conAnio(+m[5], +m[4], m[6] && +m[6]);
        }
        // 15 al 19 de noviembre · del 15 al 19 nov · 15-19 nov
        else if (
          (m = hallar(
            `\\b(\\d{1,2})\\s*(?:(?:de\\s+)?${MES}\\s*)?${CON}\\s*(?:el\\s*)?(\\d{1,2})\\s*(?:de\\s+)?${MES}(?:\\s+(?:de\\s+)?(\\d{4}))?`,
            (x) => mesDe(x[4]) && (!x[2] || mesDe(x[2])),
          ))
        ) {
          const m2 = mesDe(m[4]),
            m1 = m[2] && mesDe(m[2]) ? mesDe(m[2]) : m2;
          ini = conAnio(m1, +m[1], m[5] && +m[5]);
          fin = conAnio(m2, +m[3], m[5] && +m[5]);
        }
        // nov 15-19 · november 15 to 19 · from Nov 15 to Nov 19
        else if (
          (m = hallar(
            `\\b${MES}\\s+(\\d{1,2})(?:st|nd|rd|th)?\\s*${CON}\\s*(?:${MES}\\s+)?(\\d{1,2})`,
            (x) => mesDe(x[1]) && (!x[3] || mesDe(x[3])),
          ))
        ) {
          const m1 = mesDe(m[1]),
            m2 = m[3] && mesDe(m[3]) ? mesDe(m[3]) : m1;
          ini = conAnio(m1, +m[2]);
          fin = conAnio(m2, +m[4]);
        }
        // solo llegada: "el 15 de noviembre", "15/11", "nov 15"
        if (!ini) {
          if ((m = hallar(`\\b(\\d{1,2})\\s+(?:de\\s+)?${MES}(?:\\s+(?:de\\s+)?(\\d{4}))?`, (x) => mesDe(x[2]))))
            ini = conAnio(mesDe(m[2]), +m[1], m[3] && +m[3]);
          else if ((m = hallar(`\\b${MES}\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b`, (x) => mesDe(x[1]))))
            ini = conAnio(mesDe(m[1]), +m[2]);
          else if ((m = t.match(/\b(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?\b/)) && +m[2] <= 12)
            ini = conAnio(+m[2], +m[1], m[3] && +m[3]);
        }
        // "check-in 20/11 … check-out 22/11": dos fechas sueltas
        if (!fin) {
          const dd = [...t.matchAll(/\b(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?\b/g)]
            .map((x) => +x[2] <= 12 && conAnio(+x[2], +x[1], x[3] && +x[3]))
            .filter(Boolean);
          if (dd.length >= 2 && dd[1] > dd[0]) [ini, fin] = dd;
        }
        // si la salida quedó antes de la llegada, cruza de año (28 dic al 2 ene)
        if (ini && fin && fin <= ini) fin = conAnio(+fin.slice(5, 7), +fin.slice(8, 10), +ini.slice(0, 4) + 1);
        const numW = (w) => (/^\d+$/.test(w) ? +w : PED_NUM[w] || 0);
        const NUMW = "(\\d{1,2}|" + Object.keys(PED_NUM).join("|") + ")";
        // noches
        if ((m = t.match(new RegExp(`\\b${NUMW}\\s+(?:noches?|nights?|notti|notte|nuits?|nachte?|noites?)\\b`))))
          out.noches = numW(m[1]);
        if (ini && !fin && out.noches) {
          const x = new Date(ini + "T12:00:00");
          x.setDate(x.getDate() + out.noches);
          fin = x.toISOString().slice(0, 10);
        }
        if (ini) out.in = ini;
        if (fin && fin > ini) out.out = fin;
        // personas
        if (
          (m = t.match(
            new RegExp(
              `\\b${NUMW}\\s+(?:personas?|pax|pasajeros?|adultos?|people|persons?|adults?|guests?|persone|adulti|personnes|adultes|personen|erwachsene|pessoas)\\b`,
            ),
          ))
        )
          out.pax = numW(m[1]);
        else if ((m = t.match(new RegExp(`\\b(?:somos|we are|siamo|nous sommes|wir sind)\\s+${NUMW}\\b`)))) out.pax = numW(m[1]);
        const ninos = t.match(
          new RegExp(`\\b${NUMW}\\s+(?:ninos?|ninas?|hijos?|children|kids?|bambini|enfants|kinder|criancas)\\b`),
        );
        if (ninos) out.ninos = numW(ninos[1]);
        // habitaciones: "2 dobles", "una habitación matrimonial", "1 double room"
        for (const [id, re] of PED_HAB) {
          const g = new RegExp(
            `\\b${NUMW}\\s+(?:habitaci(?:on|ones)\\s+|hab\\.?\\s+|rooms?\\s+|camere?\\s+|chambres?\\s+)?(?:${re.source.replace(/^\\b\(|\)\\b$/g, "")})`,
            "g",
          );
          let n = 0,
            r;
          while ((r = g.exec(t))) n += numW(r[1]);
          if (!n && re.test(t)) n = 1;
          if (n) out.hab[id] = n;
        }
        // "doble matrimonial" es matrimonial, no doble + matrimonial
        if (out.hab.matri && out.hab.doble && /dobles?\s+matrimonial|double bed/.test(t) && !/2 camas|dos camas|twin/.test(t))
          delete out.hab.doble;
        for (const [id, re] of PED_TOUR)
          if (re.test(t) && !(id === "lauca" && /tacora|visviri/.test(t) && !/lauca|chungar/.test(t))) out.tours.push(id);
        // idioma
        let best = "es",
          bs = 0;
        for (const [k, re] of Object.entries(PED_LANG)) {
          const n = (t.match(re) || []).length;
          if (n > bs) [best, bs] = [k, n];
        }
        out.lang = best;
        // contacto
        if ((m = raw.match(/[\w.+-]+@[\w-]+\.[\w.-]+/))) out.mail = m[0].toLowerCase();
        if ((m = raw.match(/(?:\+\d{1,3}[\s.-]?)?(?:\(?\d{1,4}\)?[\s.-]?){2,5}\d{3,4}/g))) {
          const tel = m
            .map((x) => x.trim())
            .find(
              (x) => x.replace(/\D/g, "").length >= 8 && !/^\d{1,2}[\/.-]\d{1,2}/.test(x) && !/^\d{1,2}\.\d{3}\.\d{3}/.test(x),
            );
          if (tel) out.tel = tel;
        }
        if (
          (m = raw.match(
            /\b(?:soy|me llamo|mi nombre es|my name is|i am|i'm|mi chiamo|je m'appelle|ich bin)\s+([A-ZÁÉÍÓÚÑ][\wÁÉÍÓÚÑáéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑ][\wÁÉÍÓÚÑáéíóúñ]+){0,2})/,
          ))
        )
          out.nombre = m[1];
        if (/\bfactura\b|\binvoice\b/.test(t)) out.factura = true;
        // resumen para Nik
        const fD = (s) => s.slice(8, 10) + "/" + s.slice(5, 7);
        if (out.in) out.leido.push(out.out ? `${fD(out.in)} → ${fD(out.out)}` : `llega ${fD(out.in)}`);
        else out.falta.push("fechas");
        if (out.in && !out.out) out.falta.push("salida");
        if (out.pax) out.leido.push(`${out.pax} pax${out.ninos ? ` (${out.ninos} niños)` : ""}`);
        else out.falta.push("personas");
        const nh = Object.entries(out.hab);
        if (nh.length) out.leido.push(nh.map(([k, n]) => `${n} ${k === "matri" ? "matrimonial" : k}`).join(", "));
        else out.falta.push("tipo de habitación");
        if (out.tours.length) out.leido.push("tours: " + out.tours.join(", "));
        if (out.lang !== "es") out.leido.push("idioma " + out.lang.toUpperCase());
        if (out.factura) out.leido.push("pide factura");
        return out;
      }
      /* ---------- qué responder ----------
         Lee la última pregunta del pasajero y propone la respuesta guardada que corresponde
         (o "Cotizar" si pide precio o disponibilidad). Busca por tema, no por texto exacto,
         así sigue funcionando aunque Nik reescriba sus respuestas. */
      const SUG_TEMAS = [

        const rot = texto.match(/(?:raz[oó]n social|nombre)\s*:\s*([^\n]+?)(?=\s+(?:r\.?u\.?t|giro|direcci|comuna)\b|\n|$)/i);
        const soc = /\b(ltda\.?|limitada|spa|s\.\s?a\.?|eirl|sociedad)\b/i.test(emp.nombre || "");
        const nombre = (rot && rot[1].trim()) || (soc && emp.nombre) || cn?.nombre || info.nombre || emp.nombre || "";
        const ped = parsePedido(texto, today());
        return {
          texto,
          nombre: nombre || info.tels[0] || "Sin nombre",
          cn,
          rec: {
            nombre,
            rut: rut ? RUT.fmt(rut) : "",
            giro: emp.giro || cn?.giro || "",
            dir: emp.dir || "",
            comuna: emp.comuna || "",
            mail: emp.mail || info.mails[0] || cn?.mailFact || "",
          },
          contacto: { nombre: info.nombre, tel: info.tels[0] || "", mail: info.mails[0] || "" },
          tipo,
          neto: tipo === "factura" && neto,
          its,
          separado,
          pagos,
          ajuste,
          quiereDoc: (fac || bol) && its.length > 0,
          faltaMonto: (fac || bol) && !its.length,
          ped,
          cotizar: !fac && !bol && (ped.in || /cotiz|disponib|reserv|precio|cuanto|valor|tarifa/.test(t)),
          faqs: !fac && !bol ? sugerirRespuestas(texto, S.faq).filter((x) => !x.cot) : [],

        };

      // agrupa bloques que comparten RUT, correo, teléfono o nombre; los avisos del banco se unen por razón social
      function pegadoGrande(txt) {
        if (!String(txt || "").trim()) return [];
        const yo = pgPropios(),
          B = pgBloques(txt),
          par = B.map((_, i) => i),
          raiz = (i) => (par[i] === i ? i : (par[i] = raiz(par[i]))),
          une = (a, b) => (par[raiz(a)] = raiz(b)),
          duen = new Map(),
          I = B.map((b) => pgIds(b, yo));
        I.forEach((x, i) => {
          for (const id of x.ids) duen.has(id) ? une(i, duen.get(id)) : duen.set(id, i);
        });
        // mismo nombre escrito distinto ("Ana Soto" en el correo, "Ana Soto Rojas" en WhatsApp)
        const tok = (n) => pgSoc(n || "");
        I.forEach((x, i) => {
          const a = tok(x.info.nombre);
          if (!a.length) return;
          I.forEach((y, j) => {
            if (j <= i) return;
            const b = tok(y.info.nombre);
            if (b.length && a[0] === b[0] && a.filter((w) => b.includes(w)).length >= 2) une(i, j);
          });
        });
        // bloques sin identificadores (respuestas citadas, "gracias") van con el bloque anterior
        I.forEach((x, i) => {
          if (!x.ids.size && !x.info.banco && i > 0) une(i, i - 1);
        });
        // aviso del banco → el caso cuya razón social se parece
        I.forEach((x, i) => {
          if (!x.info.banco) return;
          const w = pgSoc(x.info.banco);
          const j = B.findIndex((b, k) => {
            if (k === i || B[k].tipo === "banco") return false;
            const n = pgSoc(parseEmpresa(b.texto).nombre || I[k].info.nombre || "");
            return n.length && w.length && (n[0] === w[0] || n.filter((z) => w.includes(z)).length >= 2);
          });
          if (j >= 0) une(i, j);
        });
        const G = new Map();
        B.forEach((b, i) => (G.has(raiz(i)) ? G.get(raiz(i)) : G.set(raiz(i), []).get(raiz(i))).push(b));
        return [...G.values()]
          .map((bs) => pgCaso(bs, yo))
          .filter((c) => c.quiereDoc || c.faltaMonto || c.pagos.length || c.cotizar || c.faqs.length || c.rec.rut || c.cierre);
      }
      // acciones propuestas por caso (cada una con su casilla)
      function pgAcciones(c) {
        const A = [];
        const r = c.rec;
        if (r.rut || c.contacto.tel || c.contacto.mail) {
          const falta = c.cn
            ? ["giro", "dir", "mailFact", "tel", "contacto"].filter(
                (k) =>
                  !c.cn[k] &&
                  (k === "giro"
                    ? r.giro
                    : k === "dir"
                      ? r.dir
                      : k === "mailFact"
                        ? r.mail
                        : k === "tel"
                          ? c.contacto.tel
                          : c.contacto.nombre),
              )
            : null;
          if (!c.cn || falta.length)
            A.push({
              k: "ficha",
              on: true,
              t: c.cn ? `Completar la ficha de ${c.cn.nombre}` : `Crear ficha: ${r.nombre || c.nombre}`,
              s: [
                r.rut,
                r.giro,
                r.dir,

        }
        if (c.quiereDoc) {
          const docs = c.separado && c.its.length > 1 ? c.its.map((i) => [i]) : [c.its];
          docs.forEach((its) => {

            const { E, W, c: k } = emiPre(e);
            // si ya hay una igual (mismo cliente y monto) no se vuelve a crear
            const ya = S.facs.find(

              on: !ya && !E.some((x) => /RUT|razón social|servicio/.test(x)),

              s:
                its.map((i) => i.d).join(" · ") +
                (c.ajuste ? ` · va por lo transferido (${clp(c.ajuste)} sobre lo cotizado)` : "") +
                (E.length ? " · ⚠ " + E[0] : W.length && !ya ? " · " + W[0] : ""),

        }

          A.push({
            k: "aviso",

        c.pagos.forEach((p) =>
          A.push({
            k: "pago",
            on: true,
            t: `Pago recibido: ${clp(p.monto)}${p.fecha ? " el " + fDs(p.fecha) : ""}`,
            s: p.msg ? `Mensaje: "${p.msg}"` : "Aviso del banco",
            p,
          }),

        if (c.cotizar) A.push({ k: "cot", t: "Cotizar", s: c.ped.leido.join(" · ") || "Con lo que pidió" });
        c.faqs.forEach((f) => A.push({ k: "faq", t: "Responder: " + f.q, s: f.a, f }));
        if (!A.length && c.cierre) A.push({ k: "nada", t: "No necesita respuesta", s: "Terminó con un agradecimiento." });
        return A;
      }
      function pegadoAplicar(casos) {
        const r = { cont: 0, contAct: 0, facs: 0, pagos: 0 };
        for (const c of casos) {
          const A = c.acc.filter((a) => a.on);
          const ficha = A.find((a) => a.k === "ficha");

          const total = docs.reduce((s, a) => s + emiCalc(a.e).total, 0),
            pagado = pagos.reduce((s, p) => s + p.monto, 0);
          for (const a of docs) {
            const k = emiCalc(a.e);
            const nota = pagos.length
              ? `Pagado por transferencia: ${pagos.map((p) => `${clp(p.monto)}${p.fecha ? " el " + fDs(p.fecha) : ""}`).join(" + ")}${Math.abs(pagado - total) > 0 && pagado ? ` (diferencia ${clp(pagado - total)} con lo emitido)` : ""}.`
              : "";
            const x = importPaquete(
              {
                app: "nkops-import",
                facs: [
                  {
                    ...a.e,
                    importId: `pg-${RUT.clean(a.e.rec.rut) || normTxt(a.e.rec.nombre)}-${k.total}-${normTxt(a.e.items[0].d).slice(0, 24)}`,
                    nota,
                  },
                ],
              },
              "Pega todo aquí",
            );
            r.facs += x.facs;
          }
          // pago sin documento nuevo: se registra en la gestión o en la boleta/factura que coincide
          if (pagos.length && !docs.length)
            for (const p of pagos) {
              const f = S.facs.find((x) => x.total === p.monto && !/Pagado/.test(x.nota || ""));
              if (f) {
                f.nota = [f.nota, `Pagado por transferencia ${clp(p.monto)}${p.fecha ? " el " + fDs(p.fecha) : ""}.`]
                  .filter(Boolean)
                  .join(" ");
                r.pagos++;
                continue;
              }
              const d = S.docs.find((x) => !["perdida", "borrador"].includes(x.estado) && calc(x).saldo === p.monto);
              if (d) {
                d.pagos.push({
                  id: nextFolio("P"),
                  fecha: p.fecha || today(),
                  monto: p.monto,
                  medio: "Transferencia",
                  neg: primaryNeg(d),
                  ref: "Aviso del banco" + (p.msg ? ": " + p.msg : ""),
                });
                d.hist.unshift({ t: Date.now(), a: `Pago ${clp(p.monto)} registrado desde el aviso del banco` });
                r.pagos++;
              }
            }
        }
        audit(`Pega todo aquí: ${r.cont} fichas nuevas, ${r.contAct} completadas, ${r.facs} documentos, ${r.pagos} pagos`);
        save();
        return r;
      }

      /* ---------- combustible ----------
         Venta de diésel y bencina en bidones desde el hotel. Dos estanques con su stock en litros:
         cada venta descuenta, cada carga suma, una medición con varilla corrige (queda la diferencia).
         Todo movimiento lleva folio XNK-C-…, entra a la caja del día y se puede deshacer. */
      const COMB_MEDIOS = ["Efectivo CLP", "Transferencia", "Tarjeta", "Link Mercado Pago", "Efectivo USD"];
      const combSeed = () => ({
        tq: {
          diesel: { n: "Diésel", cap: 0, stock: 0, bidonL: 20, precioBidon: 60000, min: 40 },
          bencina: { n: "Bencina", cap: 0, stock: 0, bidonL: 20, precioBidon: 65000, min: 40 },
        },
        recargoTarjeta: false, // pendiente: Nik confirma si el 2% del mesón aplica también al combustible
        movs: [],
      });
      // precio de una venta: por bidón completo, o litros sueltos al valor proporcional (redondeado a $100)
      function combPrecio(k, litros) {
        const t = S.comb.tq[k],
          b = litros / t.bidonL;
        return Number.isInteger(b) ? b * t.precioBidon : Math.round((litros * t.precioBidon) / t.bidonL / 100) * 100;
      }
      // Devuelve [error] o [null, movimiento]. No guarda: quien llama decide (permite vista previa).
      function combVenta(k, litros, medio, extra = {}) {
        const t = S.comb.tq[k];
        litros = +litros;
        if (!t) return ["Elige diésel o bencina"];
        if (!(litros > 0)) return ["Indica cuántos bidones o litros"];
        if (!COMB_MEDIOS.includes(medio)) return ["Elige cómo pagó"];
        if (litros > t.stock + 1e-9)
          return [
            `No alcanza: en el estanque de ${t.n.toLowerCase()} quedan ${fmtL(t.stock)}. Registra una carga o una medición.`,
          ];
        let monto = combPrecio(k, litros);
        const recargo =
          medio === "Tarjeta" && S.comb.recargoTarjeta && S.cfg.recargoTarjeta
            ? Math.round((monto * S.cfg.recargoTarjeta) / 100)
            : 0;
        monto += recargo;
        const mv = {
          id: uid(),
          folio: nextFolio("C"),
          t: Date.now(),
          fecha: today(),
          tipo: "venta",
          k,
          litros,
          monto,
          recargo,
          medio,
          usd: 0,
          cli: (extra.cli || "").trim(),
          nota: (extra.nota || "").trim(),
        };
        if (medio === "Efectivo USD") {
          const kx = dolarCasa();
          if (!kx) return ["Sin dólar del día: cobra en pesos o escribe el monto en CLP en la nota"];
          mv.usd = Math.ceil(monto / kx);
        }
        return [null, mv];
      }
      function combCarga(k, litros, extra = {}) {
        const t = S.comb.tq[k];
        litros = +litros;
        if (!t) return ["Elige diésel o bencina"];
        if (!(litros > 0)) return ["Indica cuántos litros cargaste"];
        if (t.cap && t.stock + litros > t.cap + 1e-9)
          return [`No cabe: el estanque es de ${fmtL(t.cap)} y tiene ${fmtL(t.stock)}.`];
        return [
          null,
          {
            id: uid(),
            folio: nextFolio("C"),
            t: Date.now(),
            fecha: today(),
            tipo: "carga",
            k,
            litros,
            costo: +extra.costo || 0,
            nota: (extra.nota || "").trim(),
          },
        ];
      }
      // medición real con varilla: deja el stock en lo medido y registra la diferencia (+ sobra, − falta)
      function combMedicion(k, medido, extra = {}) {
        const t = S.comb.tq[k];
        medido = +medido;
        if (!t) return ["Elige diésel o bencina"];
        if (!(medido >= 0) || String(extra.raw ?? medido).trim() === "") return ["Escribe los litros medidos"];
        if (t.cap && medido > t.cap) return [`El estanque es de ${fmtL(t.cap)}: revisa la medición.`];
        return [
          null,
          {
            id: uid(),
            folio: nextFolio("C"),
            t: Date.now(),
            fecha: today(),
            tipo: "medicion",
            k,
            litros: +(medido - t.stock).toFixed(1),
            medido,
            nota: (extra.nota || "").trim(),
          },
        ];
      }
      function combAplicar(mv) {
        const t = S.comb.tq[mv.k];
        if (mv.tipo === "venta") t.stock -= mv.litros;
        else if (mv.tipo === "carga") t.stock += mv.litros;
        else t.stock = mv.medido;
        t.stock = Math.max(0, +t.stock.toFixed(1));
        S.comb.movs.unshift(mv);
        audit(
          `Combustible ${mv.tipo} ${mv.folio} · ${t.n} ${fmtL(Math.abs(mv.litros))}${mv.monto ? " · " + clp(mv.monto) : ""}`,
          mv.folio,
        );
      }
      // deshacer: solo el último movimiento de ese estanque, para que el stock nunca quede inconsistente
      function combDeshacer(id) {
        const mv = S.comb.movs.find((x) => x.id === id);
        if (!mv) return "No encontré el movimiento";
        const ult = S.comb.movs.find((x) => x.k === mv.k && !x.anulado);
        if (ult !== mv) return "Solo se puede deshacer el último movimiento de ese estanque";
        const t = S.comb.tq[mv.k];
        if (mv.tipo === "venta") t.stock += mv.litros;
        else if (mv.tipo === "carga") t.stock -= mv.litros;
        else t.stock = +(mv.medido - mv.litros).toFixed(1);
        t.stock = Math.max(0, +t.stock.toFixed(1));
        mv.anulado = Date.now();
        audit(`Combustible anulado ${mv.folio}`, mv.folio);
        return "";
      }
      const fmtL = (l) => `${(+l).toLocaleString("es-CL", { maximumFractionDigits: 1 })} L`;
      // recuento de un período (desde/hasta ISO inclusive)
      function combResumen(desde, hasta) {
        const R = {};
        for (const k of Object.keys(S.comb.tq))
          R[k] = { litros: 0, bidones: 0, monto: 0, ventas: 0, cargas: 0, ajuste: 0, medios: {} };
        for (const mv of S.comb.movs) {
          if (mv.anulado || mv.fecha < desde || mv.fecha > hasta) continue;
          const r = R[mv.k];
          if (mv.tipo === "venta") {
            r.litros += mv.litros;
            r.bidones += mv.litros / S.comb.tq[mv.k].bidonL;

        return R;
      }
      function combAlertas(A) {

            A("info", `${t.n}: falta la capacidad del estanque y el stock inicial`, "Combustible → Medir.", "go('comb')");
          else if (t.stock < t.bidonL)

          else if (t.stock <= t.min)

      async function unzip(buf) {

            nl = dv.getUint16(p + 28, true),
            xl = dv.getUint16(p + 30, true),
            cl = dv.getUint16(p + 32, true),
            off = dv.getUint32(p + 42, true);

            comp,
            data: new Uint8Array(buf, off + 30 + lnl + lxl, cs),
          };

        }

          names: Object.keys(F),
          async text(k) {
            const f = F[k];
            if (!f) return null;
            if (f.comp === 0) return new TextDecoder().decode(f.data);
            return new Response(new Blob([f.data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();

      /* Paquete de importación (archivo XNK-importar-*.json): fichas del Directorio, boletas o facturas

         y lo ya importado (mismo importId) no se repite. */
      function importPaquete(j, origen) {
        if (j?.app !== "nkops-import") throw new Error("formato");
        const r = { cont: 0, contAct: 0, facs: 0, docs: 0, rep: 0, vinc: 0 };
        // vinculación del conector generada en este PC: solo reemplaza una que nunca recibió nada
        if (j.waSync) {
          const w = j.waSync;
          const ok =
            /^[a-f0-9]{32}$/.test(w.pairId) &&
            /^[A-Za-z0-9+/]{43}=$/.test(w.authToken) &&
            w.privateKey?.kty === "RSA" &&
            w.privateKey.d &&
            w.publicKey?.kty === "RSA";
          if (ok && (!S.waSync?.privateKey || !Object.keys(S.waSync.channels || {}).length)) {
            S.waSync = {
              pairId: w.pairId,
              authToken: w.authToken,
              publicKey: w.publicKey,
              privateKey: w.privateKey,
              channels: {},
            };
            audit("Conector local vinculado desde " + origen);
            r.vinc = 1;
          } else r.vinc = -1;
        }
        for (const x of j.cont || []) {
          const o =
            (x.rut && S.cont.find((c) => RUT.clean(c.rut) === RUT.clean(x.rut))) ||
            S.cont.find((c) => normTxt(c.nombre) === normTxt(x.nombre));
          if (o) {
            let ch = 0;
            for (const [k, v] of Object.entries(x)) if (v && typeof v !== "object" && !o[k]) ((o[k] = v), ch++);
            if (x.reglas) o.reglas = { ...x.reglas, ...o.reglas };
            if (ch) r.contAct++;
          } else {
            S.cont.push({
              id: uid(),
              tipo: "empresa",
              alias: "",
              giro: "",
              dir: "",
              contacto: "",
              tel: "",
              mail: "",
              mailFact: "",
              pais: "CL",
              reglas: {},
              notas: "",
              ...clone(x),
              rut: x.rut ? RUT.fmt(x.rut) : "",
            });
            r.cont++;
          }
        }
        for (const x of j.facs || []) {
          if (x.importId && S.facs.some((f) => f.importId === x.importId)) {
            r.rep++;
            continue;
          }
          const e = Object.assign(emiNew(x.tipo || "boleta", x.neg || "HLV"), clone(x));
          e.id = uid();
          e.rec = { ...emiNew().rec, ...x.rec };
          const cn = e.rec.rut && S.cont.find((c) => RUT.clean(c.rut) === RUT.clean(e.rec.rut));
          if (cn) e.rec.contId = cn.id;
          const { E, c } = emiPre(e);
          e.folio = nextFolio("F");
          e.estado = E.length ? "borrador" : "preparada";
          // documento ya emitido en el SII: llega registrado con su N°
          if (x.estado === "emitida" && /^\d+$/.test(String(x.num || "")))
            Object.assign(e, { estado: "emitida", num: String(x.num), enviado: +x.enviado || 0 });
          e.total = c.total;
          e.rut = e.rec.rut ? RUT.fmt(e.rec.rut) : "";
          e.cli = e.rec.nombre;
          e.cont = cn?.id || null;
          e.creado = Date.now();
          S.facs.unshift(e);
          audit(`${e.folio} importada · ${e.tipo} ${clp(c.total)} · ${e.cli} (${origen})`, e.folio);
          r.facs++;
        }
        for (const x of (j.docs || []).filter((x) => !S.docs.some((d) => d.importId === x.importId))) {
          const d = Object.assign(newDoc(), clone(x));
          if (x.promoTours && !x.promos) d.promos = { HLV: "", VVT: "vvt15" };
          d.id = uid();
          d.folio = nextFolio();
          d.lineas.forEach((l) => (l.id = uid()));
          d.pagos.forEach((p) => (p.id = p.id || nextFolio("P")));
          d.hist = [{ t: Date.now(), a: "Importada · " + (x.origen || origen) }];
          S.docs.push(d);
          r.docs++;
        }
        audit(
          `Importación ${origen}: ${r.cont} fichas nuevas, ${r.contAct} completadas, ${r.facs} documentos, ${r.docs} gestiones`,
        );
        return r;
      }

      /* =====================================================================
   v1.3 · CRM de pasajeros. Fuentes locales: Booking, gestiones XNK,
   exports de chats de WhatsApp (HLV/VVT), contactos de Outlook (CSV).
   Todo se procesa y queda cifrado en este PC.
   ===================================================================== */
      const CH = {
        hlvwa: ["WhatsApp HLV", "HLV", "wa"],
        vvtwa: ["WhatsApp VVT", "VVT", "wa"],
        hlvmail: ["Correo HLV", "HLV", "mail"],
      };
      const t9 = (x) => phoneDigits(x).slice(-9);
      function crmFind(tel, mail, nombre) {
        const T = tel && t9(tel).length >= 8 ? t9(tel) : null,
          M = (mail || "").toLowerCase().trim() || null,
          N = normTxt(nombre);
        return (
          S.crm.find((p) => (T && p.tels.some((x) => t9(x) === T)) || (M && p.mails.includes(M))) ||
          S.crm.find((p) => N && normTxt(p.nombre) === N && (!T || !p.tels.length) && (!M || !p.mails.length))
        );
      }
      function crmUpsert({ nombre, tel, mail, pais, lang }, src) {
        let p = crmFind(tel, mail, nombre);
        if (!p) {
          p = {
            id: uid(),
            nombre: nombre || tel || mail || "[sin nombre]",
            tels: [],
            mails: [],
            pais: "",
            lang: "",
            canales: {},
            notas: "",
            tags: [],
            src: [],
            creado: Date.now(),
          };
          S.crm.push(p);
        }
        if (nombre && (/^\+?[\d\s-]+$/.test(p.nombre) || p.nombre === "[sin nombre]")) p.nombre = nombre;
        if (tel && !p.tels.some((x) => t9(x) === t9(tel))) p.tels.push(tel);
        const m = (mail || "").toLowerCase().trim();
        if (m && !p.mails.includes(m)) p.mails.push(m);
        if (pais && !p.pais) p.pais = pais;
        if (lang && !p.lang) p.lang = lang;
        if (src && !p.src.includes(src)) p.src.push(src);
        return p;
      }
      function crmSync() {
        S.crm = S.crm || [];
        for (const b of S.bk)
          crmUpsert(
            {
              nombre: b.nombre,
              tel: b.tel,
              mail: b.mail,
              pais: b.pais,
              lang: b.lang,
            },
            "Booking",
          );
        for (const d of S.docs)
          if (d.cli.tipo === "particular" && d.cli.nombre)
            crmUpsert(
              {
                nombre: d.cli.nombre,

      function crmLinks(p) {
        const T = p.tels.map(t9),
          M = p.mails,
          N = normTxt(p.nombre),
          hit = (tel, mail, nom) =>
            (tel && T.includes(t9(tel))) ||
            (mail && M.includes(String(mail).toLowerCase())) ||
            (normTxt(nom) === N && (!tel || !T.length));
        return {
          bk: S.bk.filter((b) => hit(b.tel, b.mail, b.nombre)),
          docs: S.docs.filter((d) => d.cli.tipo === "particular" && hit(d.cli.tel, d.cli.mail, d.cli.nombre)),
        };

      /* Conversaciones que Nik corta a propósito: no son pendientes. */
      const CIERRES = [
        "No necesita respuesta",
        "Pide algo que no ofrecemos",
        "Pide algo que no puedo responder",
        "Lo resolví por otro canal",
      ];
      const MOTPERD = [
        "No respondió",
        "Eligió otra opción",
        "Pidió algo que no ofrecemos",
        "Cambió o canceló el viaje",
        "No necesitaba más",
      ];
      const FIN_W = new Set(
        "ok oka okey okis vale dale listo perfecto perfect genial excelente buenisimo bacan super gracias muchas mil grax thanks thank you igualmente saludos bendiciones cordiales de nada a usted ti nos vemos muy amable amables great no se preocupe preocupes problema tranquilo tranquila".split(
          " ",
        ),
      );
      // "Gracias", "ok", "👍" o "saludos" cierran la conversación: no esperan respuesta.
      function cierraSolo(t) {
        if (!t || /\?/.test(t)) return false;
        const w = normTxt(t)
          .replace(/[^a-zñ\s]/g, " ")
          .split(/\s+/)
          .filter(Boolean);
        return w.length <= 6 && w.every((x) => FIN_W.has(x));
      }
      const ESTC = {
        activo: ["En el hotel", "ok"],
        proximo: ["Próximo", "HLV"],
        potencial: ["Potencial", "VVT"],
        pasado: ["Pasado", ""],
        perdido: ["Perdido", "err"],
        frio: ["Frío", ""],
      };
      function crmEstado(p) {
        const td = today(),
          { bk, docs } = crmLinks(p),
          bA = bk.filter((b) => b.activa),
          dOk = docs.filter((d) => ["aceptada", "pagada", "checkin", "facturada"].includes(d.estado) && d.in);
        const stays = [...bA.map((b) => [b.in, b.out]), ...dOk.map((d) => [d.in, d.out])];
        const last = Math.max(
          0,
          ...Object.values(p.canales).map((c) =>
            c.observed && (!c.last || c.observed > c.last) ? +pd(c.observed) : c.last ? +pd(c.last) : 0,
          ),
        );
        const sinResp = Object.entries(p.canales)
          .filter(
            ([k, c]) =>
              c.lastFrom === "cliente" &&
              c.last &&
              (!c.observed || c.observed <= c.last) &&
              diffDays(c.last, td) <= 30 &&
              !cierraSolo(c.snip) &&
              !(p.cierre && p.cierre.d >= c.last),
          )
          .map(([k]) => k);
        const abiertas = docs.filter((d) => ["borrador", "enviada"].includes(d.estado));
        const pasadas = stays.filter((s) => s[1] <= td).length;
        let e = "frio";
        if (stays.some((s) => s[0] <= td && td < s[1])) e = "activo";
        else if (stays.some((s) => s[0] > td)) e = "proximo";
        else if (abiertas.length) e = "potencial";
        else if (pasadas) e = "pasado";
        else if (last && (Date.now() - last) / 864e5 <= 90) e = "potencial";
        else if (bk.length || docs.some((d) => d.estado === "perdida")) e = "perdido";
        const valor =
          docs.filter((d) => d.estado !== "perdida").reduce((s, d) => s + calc(d).pagado, 0) +
          bA.filter((b) => b.out <= td).reduce((s, b) => s + pint(b.precio), 0);
        const prox = stays.filter((s) => s[0] >= td).sort()[0];
        return {
          e,
          sinResp,
          pasadas,
          abiertas: abiertas.length,
          valor,
          last: last ? iso(new Date(last)) : "",
          prox,
          bk,
          docs,
          recurrente: (pasadas > 0 && e !== "pasado") || pasadas > 1,

      /* ---------- importadores ---------- */
      function parseWA(txt, fname) {
        const re =
            /^\[?(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*(?:[ap]\.?\s?m\.?)?\]?\s*(?:-\s*)?([^:]{1,60}?):\s(.*)$/i,
          ms = [];
        for (const ln of txt.split(/\r?\n/)) {
          const m = ln.replace(/[‎‏ ]/g, " ").trim().match(re);
          if (m) {
            const y = m[3].length === 2 ? "20" + m[3] : m[3];
            ms.push({
              d: `${y}-${pad(m[2])}-${pad(m[1])}`,
              who: m[6].trim(),
              tx: m[7],
            });
          }
        }
        if (!ms.length) return null;
        let contacto = (fname.match(/(?:con|with|-)\s+(.+?)(?:\.txt|\.zip)?$/i) || [])[1]?.trim();
        const autores = [...new Set(ms.map((m) => m.who))];
        if (!contacto || !autores.includes(contacto)) {
          const cnt = {};
          ms.forEach((m) => (cnt[m.who] = (cnt[m.who] || 0) + 1));
          contacto =
            (contacto && autores.find((a) => normTxt(a) === normTxt(contacto))) ||
            autores.find((a) => /^\+?[\d\s()-]{8,}$/.test(a)) ||
            autores.sort((a, b) => cnt[a] - cnt[b])[0];
        }
        const del = ms.filter((m) => m.who === contacto),
          lastM = ms[ms.length - 1];
        return {
          contacto,
          tel: /^\+?[\d\s()-]{8,}$/.test(contacto) ? contacto : "",
          first: ms[0].d,
          last: lastM.d,
          count: ms.length,
          lastFrom: lastM.who === contacto ? "cliente" : "nosotros",
          interes: del.filter((m) =>
            /cotiz|precio|valor|disponib|reserv|tour|habitaci|price|room|booking|prezzo|prix|preis/i.test(m.tx),
          ).length,
          snip: (lastM.tx || "").slice(0, 140),
        };
      }

      function canalPref(p) {

      async function createWAPairing() {
        const vault = S;
        if (!S.waSync?.privateKey) {
          const keys = await crypto.subtle.generateKey(
            {
              name: "RSA-OAEP",
              modulusLength: 2048,
              publicExponent: new Uint8Array([1, 0, 1]),
              hash: "SHA-256",
            },
            true,
            ["encrypt", "decrypt"],
          );
          if (S !== vault) throw Error("La bóveda se bloqueó. Desbloquéala e inténtalo otra vez.");
          S.waSync = {
            authToken: b64(crypto.getRandomValues(new Uint8Array(32))),
            pairId: [...crypto.getRandomValues(new Uint8Array(16))].map((n) => n.toString(16).padStart(2, "0")).join(""),
            publicKey: await crypto.subtle.exportKey("jwk", keys.publicKey),
            privateKey: await crypto.subtle.exportKey("jwk", keys.privateKey),
            channels: {},
          };
        }
        await persist();
        if (S !== vault) throw Error("La bóveda se bloqueó. Desbloquéala e inténtalo otra vez.");
        const pairing = {
          format: "nkops-wa-pair-v1",
          pairId: S.waSync.pairId,
          publicKey: S.waSync.publicKey,
          authToken: S.waSync.authToken,
        };
        const url = URL.createObjectURL(new Blob([JSON.stringify(pairing)], { type: "application/json" }));
        const link = document.createElement("a");
        link.href = url;
        link.download = "NKOPS-vincular-whatsapp.json";
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast("Archivo de vinculación generado. Usa el mismo en ambos navegadores.");
      }
      /* v2.3 · conversaciones y correos que trae el conector (lo que Nik tiene abierto en WhatsApp, Outlook o Gmail).
         Llegan cifrados, se guardan en la bóveda (máx. 150, 30 días) y Hoy los muestra como casos con sus acciones. */
      async function abrirSobre(file) {
        if (!S?.waSync?.privateKey) throw Error("Genera la vinculación en Pasajeros → Conectar WhatsApp.");
        if (file.size > 3000000) throw Error("Archivo de conexión demasiado grande.");
        const env = JSON.parse(await file.text());
        if (env.format !== "nkops-wa-sync-v1" || env.pairId !== S.waSync.pairId)
          throw Error("Este archivo corresponde a otra vinculación.");
        const pk = await crypto.subtle.importKey("jwk", S.waSync.privateKey, { name: "RSA-OAEP", hash: "SHA-256" }, false, [
          "decrypt",
        ]);
        const raw = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, pk, ub64(env.key));
        const key = await crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]);
        const b = JSON.parse(
          new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(env.iv) }, key, ub64(env.data))),
        );
        if (b.authToken !== S.waSync.authToken) throw Error("El archivo no tiene autorización de esta vinculación.");
        return b;
      }

        if (b.kind !== "conv" || !Array.isArray(b.items) || b.items.length > 60 || !Number.isSafeInteger(b.capturedAt))

        S.bandeja ??= {};

      async function puenteScan() {
        if (!S?.waSync?.privateKey || PUENTE.busy) return;

        try {
          let lista = null;
          for (const base of [PUENTE.base, PUENTE.base.includes("127") ? "http://localhost:47615" : "http://127.0.0.1:47615"]) {
            try {
              const r = await fetch(base + "/e", { signal: AbortSignal.timeout(2500), cache: "no-store" });
              if (!r.ok) continue;
              lista = await r.json();
              PUENTE.base = base;
              break;
            } catch {
              /* probar la otra dirección */
            }
          }
          PUENTE.ok = Array.isArray(lista);
          PUENTE.t = Date.now();
          if (!PUENTE.ok) return;
          let nuevos = 0;
          for (const it of lista) {
            if (!/^(hlvwa|vvtwa)\.(sync|conv)$/.test(it?.name) || PUENTE.visto[it.name] === it.t) continue;
            try {
              const txt = await (
                await fetch(`${PUENTE.base}/e/${it.name}`, { signal: AbortSignal.timeout(4000), cache: "no-store" })
              ).text();
              const f = new File([txt], it.name + ".json");
              if (it.name.endsWith(".conv")) nuevos += await importConvFile(f);
              else {
                const r = await importWASyncFile(f);
                if (!r.ignored) nuevos += r.count;
              }
              PUENTE.visto[it.name] = it.t;
              if (S.waSync.error) delete S.waSync.error;
            } catch (error) {
              PUENTE.visto[it.name] = it.t;

            !$("#md")?.classList.contains("on") &&

          /* Es válido elegir directamente la carpeta NKOPS. */

        for (const directory of folders) {
          for await (const [name, handle] of directory.entries()) {
            if (handle.kind === "file" && /^(hlvwa|vvtwa)(?: \(\d+\))?\.nkops-conv\.json$/i.test(name)) {
              try {
                const f = await handle.getFile(),
                  key = `${name}|${f.size}|${f.lastModified}`;
                S.proc ??= {};

                const n = await importConvFile(f);

            try {

      async function importOutlookFile(file) {

          fn = ix(/^(first name|nombre)$/),

          mo = ix(/mobile|movil|telefono|phone/);
